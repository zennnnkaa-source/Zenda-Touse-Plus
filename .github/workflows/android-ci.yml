

name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-36,build-tools;36.0.0'
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Validate project
        run: python3 .github/scripts/validate_android_project.py .
      - name: Find latest release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Calculate next version
        id: version
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os,re
          tag=os.environ.get("LATEST_TAG","").strip()
          m=re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)",tag)
          major,minor,patch=map(int,m.groups()) if m else (1,0,0)
          if m: patch+=1
          version=f"{major}.{minor}.{patch}"
          code=major*1000000+minor*1000+patch
          if code>2100000000: raise SystemExit("versionCode exceeds Android limit")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"version={version}\ncode={code}\n")
          print(f"Next version: {version} (versionCode {code})")
          PY
      - name: Update Android version
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          roots=[pathlib.Path("lab"),pathlib.Path("input-target")]
          for root in roots:
              files=[root/"build.gradle",root/"build.gradle.kts"]
              file=next((p for p in files if p.is_file()),None)
              if file is None: raise SystemExit(f"Missing build.gradle in {root}")
              s=file.read_text()
              s,n1=re.subn(r'(\bversionCode\s*(?:=\s*)?)\d+',lambda m:m.group(1)+os.environ["VERSION_CODE"],s,count=1)
              s,n2=re.subn(r'(\bversionName\s*(?:=\s*)?")[^"]*(")',lambda m:m.group(1)+os.environ["VERSION_NAME"]+m.group(2),s,count=1)
              if not n1 or not n2: raise SystemExit(f"Could not update versionCode/versionName in {file}; configure them in defaultConfig first")
              file.write_text(s)
              print(f"Updated {file}")
          PY
      - name: Build and test signed Release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Secret: $name"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          gradle \
            :lab:lint \
            :input-target:lint \
            :lab:testDebugUnitTest \
            :input-target:testDebugUnitTest \
            :lab:assembleRelease \
            :input-target:assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release-key.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace
          mkdir -p release-files
          find lab/build/outputs/apk/release input-target/build/outputs/apk/release -type f -name '*.apk' -print
          find lab/build/outputs/apk/release -type f -name '*.apk' -exec cp {} release-files/lab-release.apk \;
          find input-target/build/outputs/apk/release -type f -name '*.apk' -exec cp {} release-files/input-target-release.apk \;
          test -s release-files/lab-release.apk
          test -s release-files/input-target-release.apk
          sha256sum release-files/*.apk > release-files/SHA256SUMS.txt
      - name: Verify APK signatures
        run: |
          set -e
          for apk in release-files/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            release-files/lab-release.apk \
            release-files/input-target-release.apk \
            release-files/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Android Release v$VERSION" \
            --generate-notes
